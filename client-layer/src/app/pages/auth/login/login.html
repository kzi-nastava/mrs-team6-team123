<div class="auth-container">
  <h1>Login</h1>

  <form (ngSubmit)="login()" class="auth-form">
    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      name="email"
      required
      [disabled]="loading"
      [class.input-error]="errorMessage && !email"
      autocomplete="email"
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
      required
      [disabled]="loading"
      [class.input-error]="errorMessage && !password"
      autocomplete="current-password"
    />

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loading" [class.loading]="loading">
      <span *ngIf="!loading">Login</span>
      <span *ngIf="loading" class="loading-content">
        <span class="spinner"></span>
        Logging in...
      </span>
    </button>
  </form>

  <div class="auth-links">
    <button class="link-btn" (click)="goToReset()" [disabled]="loading">
      Forgot password?
    </button>
    <button class="link-btn" (click)="goToRegister()" [disabled]="loading">
      Create account
    </button>
  </div>
</div>
