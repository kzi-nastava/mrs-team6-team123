<div class="auth-container">
  <h1>Login</h1>

  <form (ngSubmit)="login()" class="auth-form">
    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      name="email"
      required
      [disabled]="loading"
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
      required
      [disabled]="loading"
    />

    <!-- ERROR MESSAGE -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>
  </form>

  <div class="auth-links">
    <button class="link-btn" (click)="goToReset()" [disabled]="loading">
      Forgot password?
    </button>
    <button class="link-btn" (click)="goToRegister()" [disabled]="loading">
      Create account
    </button>
  </div>
</div>
