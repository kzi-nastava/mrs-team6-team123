<div class="track-ride-container">
  <div class="content-wrapper">
    <app-map 
      [mode]="'TRACK'"
      [track]="ride">
    </app-map>

    <div class="right-panel">
      <app-track-ride 
        *ngIf="ride" 
        [ride]="ride">
      </app-track-ride>
    </div>
  </div>
</div>
