<div class="favorites-container">
  <h2>My Favorite Routes</h2>

  <div *ngIf="loading" class="loading">Loading favorite routes...</div>

  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <div
    class="routes-list"
    data-testid="favorites-list"
    *ngIf="!loading && !errorMessage && favorites.length > 0"
  >
    <app-route-card
      *ngFor="let route of favorites; let i = index"
      [data]="route"
      [attr.data-route-id]="route.routeId"
      (book)="bookFavoriteRoute(i)"
      (delete)="removeFavorite(i)"
    ></app-route-card>
  </div>

  <div *ngIf="!loading && !errorMessage && favorites.length === 0" class="no-favorites">
    No favorite routes yet. Add some for quick access!
  </div>
</div>
