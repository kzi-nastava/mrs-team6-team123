<div class="unregistered-home-container">
  <div class="content-wrapper">
    <app-map [mode]="'vehicles'"></app-map>

    <div class="right-panel">
      <div class="welcome-section">
        <h2>Welcome</h2>
        <p>See available vehicles on the map and get instant ride estimates</p>
      </div>

      <button 
        mat-raised-button 
        color="primary"
        class="estimate-ride-btn"
        (click)="openEstimateDialog()">
        <span class="btn-icon">🚗</span>
        Estimate Ride
      </button>

      <button 
        mat-raised-button 
        color="accent"
        class="rate-ride-btn"
        (click)="openRateDialog()">
        <span class="btn-icon">⭐</span>
        Rate Ride
      </button>

    </div>
  </div>
</div>
