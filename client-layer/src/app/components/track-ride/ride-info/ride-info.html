<div class="ride-info">
    <div class="admin-info" *ngIf="isAdmin && rideInfo">
        <p><strong>Driver:</strong> {{ rideInfo.driver }}</p>
        <p><strong>Started at:</strong> {{ rideInfo.startedAt }}</p>
    </div>

    <div class="basic-info" *ngIf="rideInfo">
        <p><strong>From:</strong> {{ rideInfo.from }}</p>
        <p><strong>To:</strong> {{ rideInfo.to }}</p>
        <p class="time-left"><strong>{{ rideInfo.duration }}m</strong></p>
    </div>

    <div class="price-info" *ngIf="isDriver && rideInfo">
        <p><strong>Price:</strong> {{ rideInfo.price }}</p>
    </div>

    <div class="passengers-info" *ngIf="isAdmin && rideInfo">
        <p><strong>Passengers:</strong></p>
        <div class="passengers-list">
            <p *ngFor="let passenger of passengers; let i = index"
                [ngClass]="{ 'first-passenger': i === 0 }">
                {{ passenger }}
            </p>
        </div>  
    </div>

    <div class="reports-info" *ngIf="isAdmin && rideInfo">
        <p><strong>Irregularity reports:</strong></p>
        <div class="reports-list">
            <p *ngFor="let report of reports">
                {{ report }}
            </p>
        </div>
    </div>
</div>
