<table class="ride-table">
  <thead>
    <tr>
      <th *ngFor="let col of columns">{{ col }}</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let ride of rides">
      <td *ngFor="let col of columns">

        <button *ngIf="col === 'Details'" class="btn-route" (click)="showRoute(ride)">
          view
        </button>

        <span *ngIf="col !== 'Details'">
          {{ getRideValue(ride, attributes[col]) }}
        </span>

      </td>
    </tr>
  </tbody>
</table>
