<table class="ride-table">
  <thead>
    <tr>
      <th *ngFor="let col of columns">{{ col }}</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let ride of rides">
      <td *ngFor="let col of columns" [attr.data-label]="col">
          <button *ngIf="col === 'Route'" class="btn-route" (click)="showRoute()">
            view
          </button>

          <span *ngIf="col !== 'Route'">
            {{ ride[col] }}
          </span>
      </td>
    </tr>
  </tbody>
</table>
