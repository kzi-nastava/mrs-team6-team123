<!-- navbar.html -->

<mat-toolbar color="primary" class="navbar">
  <div class="nav-left">
    <img src="logo.png" alt="Logo" class="logo-img" />
    <span class="logo-text">Dusha Taxi</span>
  </div>

  <span class="spacer"></span>

  <div class="nav-links" *ngIf="links.length" [class.active]="menuActive">
      <a
        *ngFor="let link of links"
        (click)="onNavClick(link, $event)"
        [routerLink]="link.route || null"
        routerLinkActive="active">
        <img [src]="link.icon" alt="icon" class="link-icon" />
      </a>
    
    <!-- Logout dugme - samo ako je ulogovan -->
    <button *ngIf="isLoggedIn()" class="logout-btn" (click)="logout()" title="Logout">
      <img src="logout.png" alt="Logout" class="link-icon" />
    </button>
  </div>

  <button *ngIf="showHamburger" class="hamburger" (click)="toggleMenu()">&#9776;</button>
</mat-toolbar>

<app-notification-panel
  *ngIf="notificationPanelOpen"
  class="notification-panel">
</app-notification-panel>
