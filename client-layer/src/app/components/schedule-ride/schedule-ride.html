<div class="schedule-ride-container">
  <h2>Schedule a ride</h2>

  <div class="form-layout">
    <div class="left-column">
      <h3>Schedule a ride</h3>

      <!-- Starting Point -->
      <app-location-input
        label="Starting Point"
        placeholder="starting point"
        [(address)]="startAddress"
        (locationSelected)="onStartLocationSelected($event)"
        (inputChanged)="onStartInputChanged($event)"
      ></app-location-input>

      <!-- Add Stop Button -->
      <button (click)="addStop()" class="btn-add-item">+ add stop</button>

      <div *ngFor="let stop of stops" class="stop-item">
        <app-location-input
          placeholder="stop address"
          [(address)]="stop.address"
          (locationSelected)="onStopLocationSelected(stop.id, $event)"
          (inputChanged)="onStopInputChanged(stop.id, $event)"
        ></app-location-input>
        <button (click)="removeStop(stop.id)" class="btn-remove-stop">✕</button>
      </div>

      <!-- Destination -->
      <app-location-input
        label="Destination"
        placeholder="destination"
        [(address)]="endAddress"
        (locationSelected)="onEndLocationSelected($event)"
        (inputChanged)="onEndInputChanged($event)"
      ></app-location-input>

      <button (click)="addPassenger()" class="btn-add-item">+ add passenger</button>
      <div *ngFor="let passenger of passengers; let i = index" class="passenger-item">
        <input
          type="text"
          [(ngModel)]="passenger.input"
          (ngModelChange)="updatePassengerInput(i, passenger.input)"
          placeholder="passenger email or name"
          class="passenger-input"
        />
        <button (click)="removePassenger()" class="btn-remove-passenger">✕</button>
      </div>
      <textarea
        [(ngModel)]="additionalInstructions"
        placeholder="Additional instructions..."
        class="instructions-textarea"
      >
      </textarea>
    </div>

    <div class="right-column">
      <h3>Ride preferences</h3>

      <!-- Vehicle Type -->
      <select
        [(ngModel)]="vehicleType"
        (ngModelChange)="onVehicleTypeChange()"
        class="select-vehicle"
      >
        <option *ngFor="let option of vehicleOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>

      <!-- Pets/babies -->
      <div class="preferences-toggles">
        <label class="toggle-label">
          <span>must allow pets:</span>
          <mat-slide-toggle [(ngModel)]="hasPet"></mat-slide-toggle>
        </label>

        <label class="toggle-label">
          <span>must allow babies:</span>
          <mat-slide-toggle [(ngModel)]="hasBaby"></mat-slide-toggle>
        </label>
      </div>

      <select [(ngModel)]="scheduleType" class="select-schedule">
        <option value="now">now</option>
        <option value="later">schedule for later</option>
      </select>

      <!-- Time -->
      <app-schedule-time
        *ngIf="scheduleType === 'later'"
        [(selectedHour)]="scheduledHour"
        [(selectedMinute)]="scheduledMinute"
      ></app-schedule-time>

      <!-- Estimated Price -->
      <div class="ride-details" *ngIf="estimatedPrice">
        <div class="detail-row">
          <span>Estimated Price:</span>
          <strong>{{ estimating ? 'Calculating...' : estimatedPrice }}</strong>
        </div>
      </div>
    </div>

    <button (click)="bookRide()" class="btn-book">Book Ride</button>
  </div>
</div>
