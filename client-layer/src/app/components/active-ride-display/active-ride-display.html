<div class="ride-in-progress">
  <h1 class="progress-title">🚕 Ride in Progress</h1>

  <div class="ride-info-card" *ngIf="ride">
    <div class="info-row">
      <span class="label">Pickup Location:</span>
      <span class="value">{{ ride.startLocation }}</span>
    </div>
    <div class="info-row">
      <span class="label">Destination:</span>
      <span class="value">{{ ride.endLocation }}</span>
    </div>
    <div class="info-row">
      <span class="label">Passengers:</span>
      <span class="value">{{ ride.passengerNames.length }}</span>
    </div>
    <div class="info-row">
      <span class="label">Price:</span>
      <span class="value">{{ ride.estimatedPrice | currency }}</span>
    </div>
  </div>
</div>
